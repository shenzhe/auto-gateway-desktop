name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching package.json
        required: true
        type: string
      release_notes:
        description: Release notes shown by the in-app updater
        required: false
        default: Bug fixes and improvements.
        type: string
  push:
    tags:
      - "v*"
      - "desktop-v*"
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release version
    if: github.event_name == 'workflow_dispatch' || vars.DESKTOP_RELEASE_TRIGGER_MODE == 'automatic'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
            version="${version#v}"
          fi
          package_version="$(node -p "require('./package.json').version")"
          cargo_version="$(awk -F ' = ' '/^version = / { gsub(/"/, "", $2); print $2; exit }' src-tauri/Cargo.toml)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [[ "$version" != "$package_version" || "$version" != "$cargo_version" || "$version" != "$tauri_version" ]]; then
            echo "Release version must match package.json, Cargo.toml, and tauri.conf.json." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: Build, sign, and notarize macOS (${{ matrix.label }})
    needs: prepare
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            suffix: aarch64
            label: Apple Silicon
          - target: x86_64-apple-darwin
            suffix: x64
            label: Intel
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/autogateway-developer-id.p12"
          keychain_path="$RUNNER_TEMP/autogateway-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F 'Developer ID Application: WANG JING (UFC4M35743)'
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          echo "APPLE_SIGNING_IDENTITY=Developer ID Application: WANG JING (UFC4M35743)" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build signed macOS application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run tauri build -- --target "${{ matrix.target }}" --bundles app

      - name: Notarize and staple the application
        shell: bash
        env:
          APP_PATH: src-tauri/target/${{ matrix.target }}/release/bundle/macos/AUTO Gateway Desktop.app
        run: bash scripts/notarize-macos.sh

      - name: Write updater signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/tauri-updater.key"
          chmod 600 "$RUNNER_TEMP/tauri-updater.key"

      - name: Create notarized installer and updater archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          app_path="src-tauri/target/${{ matrix.target }}/release/bundle/macos/AUTO Gateway Desktop.app"
          release_dir="$RUNNER_TEMP/release"
          dmg_staging_dir="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$release_dir" "$dmg_staging_dir"
          dmg="$release_dir/AUTO Gateway Desktop_${version}_${{ matrix.suffix }}.dmg"
          archive="$release_dir/AUTO Gateway Desktop_${version}_${{ matrix.suffix }}.app.tar.gz"
          ditto "$app_path" "$dmg_staging_dir/AUTO Gateway Desktop.app"
          ln -s /Applications "$dmg_staging_dir/Applications"
          hdiutil create -volname "AUTO Gateway Desktop" -srcfolder "$dmg_staging_dir" -ov -format UDZO "$dmg"
          tar -C "$(dirname "$app_path")" -czf "$archive" "$(basename "$app_path")"
          env -u TAURI_SIGNING_PRIVATE_KEY -u TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            ./node_modules/.bin/tauri signer sign --private-key-path "$RUNNER_TEMP/tauri-updater.key" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$archive"

      - name: Publish macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  macos-universal:
    name: Build, sign, and notarize Universal macOS installer
    needs: prepare
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/autogateway-developer-id.p12"
          keychain_path="$RUNNER_TEMP/autogateway-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F 'Developer ID Application: WANG JING (UFC4M35743)'
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          echo "APPLE_SIGNING_IDENTITY=Developer ID Application: WANG JING (UFC4M35743)" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build signed Universal macOS application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run tauri build -- --target universal-apple-darwin --bundles app

      - name: Notarize and staple the Universal application
        shell: bash
        env:
          APP_PATH: src-tauri/target/universal-apple-darwin/release/bundle/macos/AUTO Gateway Desktop.app
        run: bash scripts/notarize-macos.sh

      - name: Create notarized Universal macOS installer
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/AUTO Gateway Desktop.app"
          release_dir="$RUNNER_TEMP/release"
          dmg_staging_dir="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$release_dir" "$dmg_staging_dir"
          ditto "$app_path" "$dmg_staging_dir/AUTO Gateway Desktop.app"
          ln -s /Applications "$dmg_staging_dir/Applications"
          hdiutil create -volname "AUTO Gateway Desktop" -srcfolder "$dmg_staging_dir" -ov -format UDZO "$release_dir/AUTO Gateway Desktop_${version}_universal.dmg"

      - name: Publish Universal macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ needs.prepare.outputs.version }}-universal
          path: ${{ runner.temp }}/release/*_universal.dmg
          if-no-files-found: error

  windows:
    name: Build Windows (${{ matrix.label }})
    needs: prepare
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            suffix: x64
            label: x64
          - target: aarch64-pc-windows-msvc
            suffix: arm64
            label: ARM64
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
      ARTIFACT_SIGNING_CORRELATION_ID: desktop-${{ github.run_id }}-${{ matrix.suffix }}
      AUTOGATEWAY_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install .NET 8 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Artifact Signing client
        shell: pwsh
        run: ./scripts/prepare-artifact-signing.ps1

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm ci
          $target = '${{ matrix.target }}'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/$target/release"

          # Build the application first. Running Artifact Signing directly keeps
          # the signing output visible in the workflow when Azure rejects it.
          npm run tauri build -- --target $target --no-bundle --no-sign
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri failed to build the Windows application."
          }

          $app = Get-ChildItem -LiteralPath $releaseDir -File -Filter "*.exe" |
            Where-Object { $_.Name -eq "autogateway-desktop.exe" } |
            Select-Object -First 1
          if ($null -eq $app) {
            throw "The Windows application was not produced."
          }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File ./scripts/sign-windows-artifact.ps1 -FilePath $app.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Artifact Signing failed for the Windows application."
          }

          # Bundle the already-signed executable without allowing Tauri's custom
          # signing hook to re-run it, then sign the generated installer itself.
          npm run tauri bundle -- --target $target --bundles nsis --no-sign
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri failed to bundle the Windows installer."
          }
          $installer = Get-ChildItem -LiteralPath (Join-Path $releaseDir "bundle/nsis") -File -Filter "*-setup.exe" |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "The Windows installer was not produced."
          }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File ./scripts/sign-windows-artifact.ps1 -FilePath $installer.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Artifact Signing failed for the Windows installer."
          }

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/${{ matrix.target }}/release"
          $app = Get-ChildItem -LiteralPath $releaseDir -File -Filter "*.exe" |
            Where-Object { $_.Name -eq "autogateway-desktop.exe" } |
            Select-Object -First 1
          if ($null -eq $app) {
            $app = Get-ChildItem -LiteralPath $releaseDir -File -Filter "*.exe" | Select-Object -First 1
          }
          $installer = Get-ChildItem -LiteralPath (Join-Path $releaseDir "bundle/nsis") -File -Filter "*-setup.exe" |
            Select-Object -First 1
          if ($null -eq $app -or $null -eq $installer) {
            throw "The Windows application or NSIS installer was not produced."
          }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File ./scripts/verify-windows-signatures.ps1 `
            -Files $app.FullName, $installer.FullName

      - name: Collect Windows release files
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          $source = Get-ChildItem -Path src-tauri/target/${{ matrix.target }}/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if ($null -eq $source) { throw 'The Windows NSIS installer was not produced.' }
          $releaseDir = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $target = Join-Path $releaseDir "AUTO Gateway Desktop_$version`_${{ matrix.suffix }}-setup.exe"
          Copy-Item $source.FullName $target
          Copy-Item "$($source.FullName).sig" "$target.sig"

      - name: Publish Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  windows-unified-installer:
    name: Build Windows unified installer
    needs: [prepare, windows]
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
      ARTIFACT_SIGNING_CORRELATION_ID: desktop-${{ github.run_id }}-unified
      AUTOGATEWAY_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ needs.prepare.outputs.version }}-x64
          path: ${{ runner.temp }}/windows-artifacts/x64

      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ needs.prepare.outputs.version }}-arm64
          path: ${{ runner.temp }}/windows-artifacts/arm64

      - name: Install .NET 8 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Artifact Signing client
        shell: pwsh
        run: ./scripts/prepare-artifact-signing.ps1

      - name: Build and sign architecture-selecting installer
        shell: pwsh
        run: |
          version='${{ needs.prepare.outputs.version }}'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'windows-artifacts'
          $payloadDir = Join-Path $env:RUNNER_TEMP 'unified-payload'
          $releaseDir = Join-Path $env:RUNNER_TEMP 'release'
          $x64Source = Join-Path $artifactDir "x64/AUTO Gateway Desktop_${version}_x64-setup.exe"
          $arm64Source = Join-Path $artifactDir "arm64/AUTO Gateway Desktop_${version}_arm64-setup.exe"
          if (-not (Test-Path -LiteralPath $x64Source -PathType Leaf) -or -not (Test-Path -LiteralPath $arm64Source -PathType Leaf)) {
            throw 'Both native Windows installers are required for the unified installer.'
          }
          New-Item -ItemType Directory -Force -Path $payloadDir, $releaseDir | Out-Null
          Copy-Item -LiteralPath $x64Source -Destination (Join-Path $payloadDir 'AUTO-Gateway-Desktop-x64-setup.exe')
          Copy-Item -LiteralPath $arm64Source -Destination (Join-Path $payloadDir 'AUTO-Gateway-Desktop-arm64-setup.exe')
          $makensisCommand = Get-Command makensis -ErrorAction SilentlyContinue
          $makensisPath = if ($makensisCommand) { $makensisCommand.Source } else { $null }
          if (-not $makensisPath) {
            choco install nsis --no-progress --yes
            $makensisCommand = Get-Command makensis -ErrorAction SilentlyContinue
            $makensisPath = if ($makensisCommand) { $makensisCommand.Source } else { $null }
          }
          if (-not $makensisPath) {
            $fallbackMakensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
            if (Test-Path -LiteralPath $fallbackMakensis -PathType Leaf) {
              $makensisPath = $fallbackMakensis
            }
          }
          if (-not $makensisPath) {
            throw 'NSIS makensis.exe was not found.'
          }
          $output = Join-Path $releaseDir "AUTO Gateway Desktop_${version}_setup.exe"
          & $makensisPath "-DPAYLOAD_DIR=$payloadDir" "-DOUTFILE=$output" "-DAPP_VERSION=$version" 'scripts/windows-unified-installer.nsi'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw 'The unified Windows installer was not produced.'
          }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File ./scripts/sign-windows-artifact.ps1 -FilePath $output
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File ./scripts/verify-windows-signatures.ps1 -Files $output

      - name: Publish unified Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ needs.prepare.outputs.version }}-universal
          path: ${{ runner.temp }}/release/*_setup.exe
          if-no-files-found: error

  publish-r2:
    name: Publish artifacts to R2
    needs: [prepare, macos, macos-universal, windows, windows-unified-installer]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes || 'Bug fixes and improvements.' }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Publish artifacts and updater manifest
        shell: bash
        env:
          RELEASE_DIR: ${{ github.workspace }}/release
        run: bash scripts/publish-r2.sh
