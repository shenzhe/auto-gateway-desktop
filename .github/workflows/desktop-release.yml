name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching package.json
        required: true
        type: string
      release_notes:
        description: Release notes shown by the in-app updater
        required: false
        default: Bug fixes and improvements.
        type: string
  push:
    tags:
      - "v*"
      - "desktop-v*"
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release version
    if: github.event_name == 'workflow_dispatch' || vars.DESKTOP_RELEASE_TRIGGER_MODE == 'automatic'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
            version="${version#v}"
          fi
          package_version="$(node -p "require('./package.json').version")"
          cargo_version="$(awk -F ' = ' '/^version = / { gsub(/"/, "", $2); print $2; exit }' src-tauri/Cargo.toml)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [[ "$version" != "$package_version" || "$version" != "$cargo_version" || "$version" != "$tauri_version" ]]; then
            echo "Release version must match package.json, Cargo.toml, and tauri.conf.json." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: Build, sign, and notarize macOS (${{ matrix.label }})
    needs: prepare
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            suffix: aarch64
            label: Apple Silicon
          - target: x86_64-apple-darwin
            suffix: x64
            label: Intel
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/autogateway-developer-id.p12"
          keychain_path="$RUNNER_TEMP/autogateway-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F 'Developer ID Application: WANG JING (UFC4M35743)'
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          echo "APPLE_SIGNING_IDENTITY=Developer ID Application: WANG JING (UFC4M35743)" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build signed macOS application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run tauri build -- --target "${{ matrix.target }}" --bundles app

      - name: Notarize and staple the application
        shell: bash
        env:
          APP_PATH: src-tauri/target/${{ matrix.target }}/release/bundle/macos/AUTO Gateway Desktop.app
        run: bash scripts/notarize-macos.sh

      - name: Write updater signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/tauri-updater.key"
          chmod 600 "$RUNNER_TEMP/tauri-updater.key"

      - name: Create notarized installer and updater archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          app_path="src-tauri/target/${{ matrix.target }}/release/bundle/macos/AUTO Gateway Desktop.app"
          release_dir="$RUNNER_TEMP/release"
          dmg_staging_dir="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$release_dir" "$dmg_staging_dir"
          dmg="$release_dir/AUTO Gateway Desktop_${version}_${{ matrix.suffix }}.dmg"
          archive="$release_dir/AUTO Gateway Desktop_${version}_${{ matrix.suffix }}.app.tar.gz"
          ditto "$app_path" "$dmg_staging_dir/AUTO Gateway Desktop.app"
          ln -s /Applications "$dmg_staging_dir/Applications"
          hdiutil create -volname "AUTO Gateway Desktop" -srcfolder "$dmg_staging_dir" -ov -format UDZO "$dmg"
          tar -C "$(dirname "$app_path")" -czf "$archive" "$(basename "$app_path")"
          env -u TAURI_SIGNING_PRIVATE_KEY -u TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            ./node_modules/.bin/tauri signer sign --private-key-path "$RUNNER_TEMP/tauri-updater.key" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$archive"

      - name: Publish macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  macos-universal:
    name: Build, sign, and notarize Universal macOS installer
    needs: prepare
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/autogateway-developer-id.p12"
          keychain_path="$RUNNER_TEMP/autogateway-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F 'Developer ID Application: WANG JING (UFC4M35743)'
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          echo "APPLE_SIGNING_IDENTITY=Developer ID Application: WANG JING (UFC4M35743)" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build signed Universal macOS application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run tauri build -- --target universal-apple-darwin --bundles app

      - name: Notarize and staple the Universal application
        shell: bash
        env:
          APP_PATH: src-tauri/target/universal-apple-darwin/release/bundle/macos/AUTO Gateway Desktop.app
        run: bash scripts/notarize-macos.sh

      - name: Create notarized Universal macOS installer
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/AUTO Gateway Desktop.app"
          release_dir="$RUNNER_TEMP/release"
          dmg_staging_dir="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$release_dir" "$dmg_staging_dir"
          ditto "$app_path" "$dmg_staging_dir/AUTO Gateway Desktop.app"
          ln -s /Applications "$dmg_staging_dir/Applications"
          hdiutil create -volname "AUTO Gateway Desktop" -srcfolder "$dmg_staging_dir" -ov -format UDZO "$release_dir/AUTO Gateway Desktop_${version}_universal.dmg"

      - name: Publish Universal macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ needs.prepare.outputs.version }}-universal
          path: ${{ runner.temp }}/release/*_universal.dmg
          if-no-files-found: error

  windows-build:
    name: Cross-build and prepare Windows bundle on Ubuntu (${{ matrix.label }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            suffix: x64
            label: x64
          - target: aarch64-pc-windows-msvc
            suffix: arm64
            label: ARM64
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-cross-${{ matrix.suffix }}
          workspaces: "src-tauri -> target"

      - name: Cache cargo-xwin and Windows SDK files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ${{ env.XWIN_CACHE_DIR }}
          key: cargo-xwin-${{ runner.os }}-${{ matrix.suffix }}-v1

      - name: Install Windows cross-compilation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang lld llvm nsis
          if ! command -v cargo-xwin >/dev/null 2>&1; then
            cargo install --locked cargo-xwin --version 0.23.0
          fi
          cargo xwin --version

      - name: Build unsigned Windows bundle context
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          target='${{ matrix.target }}'
          release_dir="src-tauri/target/$target/release"
          app="$release_dir/autogateway-desktop.exe"
          npm run tauri build -- \
            --runner cargo-xwin \
            --target "$target" \
            --bundles nsis \
            --no-sign \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
          test -f "$app"
          test -d "$release_dir/nsis"
          mkdir -p "$RUNNER_TEMP/bundle-context"
          cp "$app" "$RUNNER_TEMP/bundle-context/autogateway-desktop.exe"
          tar -C "$release_dir" -czf "$RUNNER_TEMP/bundle-context/nsis-context.tar.gz" nsis

      - name: Publish unsigned Windows bundle context
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-unsigned-context-${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/bundle-context/*
          if-no-files-found: error
          retention-days: 1

  windows-sign-app:
    name: Sign Windows application (${{ matrix.label }})
    needs: [prepare, windows-build]
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: x64
            label: x64
          - suffix: arm64
            label: ARM64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-windows-unsigned-context-${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/signed-context

      - name: Install .NET 8 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows application with Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ runner.temp }}\signed-context\autogateway-desktop.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          timeout: 300
          correlation-id: desktop-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}-app

      - name: Verify Windows application signature
        shell: pwsh
        run: |
          ./scripts/verify-windows-signatures.ps1 `
            -Files "$env:RUNNER_TEMP/signed-context/autogateway-desktop.exe"

      - name: Publish signed Windows bundle context
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-signed-context-${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/signed-context/*
          if-no-files-found: error
          retention-days: 1

  windows-bundle:
    name: Bundle Windows installer on Ubuntu (${{ matrix.label }})
    needs: [prepare, windows-sign-app]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            nsis_arch: x64
            suffix: x64
            label: x64
          - target: aarch64-pc-windows-msvc
            nsis_arch: arm64
            suffix: arm64
            label: ARM64
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes nsis

      - uses: actions/download-artifact@v4
        with:
          name: ci-windows-signed-context-${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/signed-context

      - name: Bundle unsigned Windows installer
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          target='${{ matrix.target }}'
          suffix='${{ matrix.suffix }}'
          release_dir="src-tauri/target/$target/release"
          context_dir="$RUNNER_TEMP/signed-context"
          nsis_dir="$release_dir/nsis/${{ matrix.nsis_arch }}"
          mkdir -p "$release_dir"
          cp "$context_dir/autogateway-desktop.exe" "$release_dir/autogateway-desktop.exe"
          tar -C "$release_dir" -xzf "$context_dir/nsis-context.tar.gz"
          test -f "$nsis_dir/installer.nsi"
          (
            cd "$nsis_dir"
            makensis installer.nsi
          )
          installer="$nsis_dir/nsis-output.exe"
          test -f "$installer"
          mkdir -p "$RUNNER_TEMP/unsigned-installer"
          cp "$installer" "$RUNNER_TEMP/unsigned-installer/AUTO Gateway Desktop_${version}_${suffix}-setup.exe"

      - name: Publish unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-unsigned-installer-${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/unsigned-installer/*-setup.exe
          if-no-files-found: error
          retention-days: 1

  windows-sign-installer:
    name: Sign Windows installer (${{ matrix.label }})
    needs: [prepare, windows-bundle]
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: x64
            label: x64
          - suffix: arm64
            label: ARM64
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: ci-windows-unsigned-installer-${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/release

      - name: Install .NET 8 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows installer with Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ runner.temp }}\release\AUTO Gateway Desktop_${{ needs.prepare.outputs.version }}_${{ matrix.suffix }}-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          timeout: 300
          correlation-id: desktop-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}-installer

      - name: Verify installer and create updater signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "release/AUTO Gateway Desktop_${{ needs.prepare.outputs.version }}_${{ matrix.suffix }}-setup.exe"
          ./scripts/verify-windows-signatures.ps1 -Files $installer

          npm ci
          if ($LASTEXITCODE -ne 0) {
            throw "npm failed to install the Tauri signing CLI."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "The Tauri updater signing key and password are required."
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "tauri-updater.key"
          $keyPassword = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          $utf8WithoutBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($keyPath, $env:TAURI_SIGNING_PRIVATE_KEY, $utf8WithoutBom)
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          $signaturePath = "${installer}.sig"
          & "$env:GITHUB_WORKSPACE/node_modules/.bin/tauri.cmd" signer sign `
            --private-key-path $keyPath `
            --password $keyPassword `
            $installer
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "The updater signature was not produced."
          }

      - name: Publish signed Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ needs.prepare.outputs.version }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  windows-unified-bundle:
    name: Bundle Windows unified installer on Ubuntu
    needs: [prepare, windows-sign-installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ needs.prepare.outputs.version }}-x64
          path: ${{ runner.temp }}/windows-artifacts/x64

      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ needs.prepare.outputs.version }}-arm64
          path: ${{ runner.temp }}/windows-artifacts/arm64

      - name: Install NSIS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes nsis

      - name: Bundle architecture-selecting installer
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          artifact_dir="$RUNNER_TEMP/windows-artifacts"
          payload_dir="$RUNNER_TEMP/unified-payload"
          release_dir="$RUNNER_TEMP/release"
          x64_source="$artifact_dir/x64/AUTO Gateway Desktop_${version}_x64-setup.exe"
          arm64_source="$artifact_dir/arm64/AUTO Gateway Desktop_${version}_arm64-setup.exe"
          test -f "$x64_source"
          test -f "$arm64_source"
          mkdir -p "$payload_dir" "$release_dir"
          cp "$x64_source" "$payload_dir/AUTO-Gateway-Desktop-x64-setup.exe"
          cp "$arm64_source" "$payload_dir/AUTO-Gateway-Desktop-arm64-setup.exe"
          output="$release_dir/AUTO Gateway Desktop_${version}_setup.exe"
          makensis \
            "-DPAYLOAD_DIR=$payload_dir" \
            "-DOUTFILE=$output" \
            "-DAPP_VERSION=$version" \
            scripts/windows-unified-installer.nsi
          test -f "$output"

      - name: Publish unsigned unified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-unsigned-unified-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/release/*_setup.exe
          if-no-files-found: error
          retention-days: 1

  windows-unified-sign:
    name: Sign Windows unified installer
    needs: [prepare, windows-unified-bundle]
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ci-windows-unsigned-unified-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/release

      - name: Install .NET 8 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign unified installer with Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ runner.temp }}\release\AUTO Gateway Desktop_${{ needs.prepare.outputs.version }}_setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          timeout: 300
          correlation-id: desktop-${{ github.run_id }}-${{ github.run_attempt }}-unified

      - name: Verify unified installer signature
        shell: pwsh
        run: |
          ./scripts/verify-windows-signatures.ps1 `
            -Files "$env:RUNNER_TEMP/release/AUTO Gateway Desktop_${{ needs.prepare.outputs.version }}_setup.exe"

      - name: Publish unified Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ needs.prepare.outputs.version }}-universal
          path: ${{ runner.temp }}/release/*_setup.exe
          if-no-files-found: error

  publish-r2:
    name: Publish artifacts to R2
    needs: [prepare, macos, macos-universal, windows-sign-installer, windows-unified-sign]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes || 'Bug fixes and improvements.' }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Publish artifacts and updater manifest
        shell: bash
        env:
          RELEASE_DIR: ${{ github.workspace }}/release
        run: bash scripts/publish-r2.sh
