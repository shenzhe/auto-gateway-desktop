[package]
name = "autogateway-desktop"
version = "0.1.32"
description = "AUTO Gateway desktop setup assistant"
authors = ["AUTO Gateway"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
dirs = "5.0"
futures-util = "0.3"
hkdf = "0.12"
keyring = "4.1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tauri = { version = "2.11", features = ["tray-icon", "devtools"] }
tauri-plugin-deep-link = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-process = "2.3"
tauri-plugin-single-instance = "2.3"
tauri-plugin-updater = "2.10"
tokio = { version = "1", features = ["sync"] }
toml_edit = "0.22"
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }
zeroize = "1.8"
